<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101715" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Seu treino, no seu ritmo. Fichas, séries e evolução salvas no seu aparelho."
    />
    <title>Treino Tiago</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/fflate.js" defer></script>
    <script src="default-plan.js" defer></script>
    <script src="core.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Ir para o conteúdo</a>
    <div class="app-shell">
      <header class="topbar">
        <a href="#hoje" class="brand" aria-label="Treino Tiago, início"
          ><span class="brand-mark" aria-hidden="true">t.</span
          ><span>treino<span class="brand-light"> tiago</span></span></a
        ><button
          class="icon-button"
          data-action="settings"
          aria-label="Ajustes e backup"
          title="Ajustes e backup"
        >
          ⚙
        </button>
      </header>
      <main id="main" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="Navegação principal">
        <button data-tab="hoje" aria-current="page">
          <span aria-hidden="true">◫</span>Hoje</button
        ><button data-tab="historico">
          <span aria-hidden="true">▦</span>Histórico</button
        ><button data-tab="evolucao">
          <span aria-hidden="true">↗</span>Evolução</button
        ><button data-tab="fichas">
          <span aria-hidden="true">▤</span>Fichas
        </button>
      </nav>
    </div>
    <aside id="timer" class="timer" aria-label="Descanso" hidden></aside>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <input
      id="plan-file"
      type="file"
      accept=".docx,.txt"
      hidden
      aria-label="Importar nova ficha"
    /><input
      id="backup-file"
      type="file"
      accept=".json"
      hidden
      aria-label="Importar backup"
    /><noscript
      >Ative o JavaScript para usar o Treino Tiago. Seus dados ficam neste
      aparelho.</noscript
    >
  </body>
</html>
